[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-virtual-outfit-backend"
version = "0.1.0"
description = "Backend API & Celery Worker for AI Virtual Outfit Preview"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Core Framework & Validation
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "pydantic==2.7.4",
    "pydantic-settings==2.3.4",

    # Database & ORM
    "sqlalchemy==2.0.31",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "alembic==1.13.2",

    # Task Queue & Broker
    "celery==5.4.0",
    "redis==5.0.7",

    # File & Image Processing
    "python-multipart==0.0.9",
    "pillow==10.4.0",
    "aiofiles==24.1.0",

    # HTTP Client
    "httpx==0.27.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest==8.2.2",
    "pytest-asyncio==0.23.8",
    "pytest-cov==5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
